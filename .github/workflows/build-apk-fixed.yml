name: Build Sparki APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Unpack Android project
        run: unzip -o sparki-project.zip

      - name: Apply Android safe-area fix
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          project = Path("sparki-door2door-android")

          main = project / "app/src/main/java/be/sparki/doortodoor/MainActivity.java"
          source = main.read_text(encoding="utf-8")
          marker = "// SPARKI_SAFE_SYSTEM_BARS"
          needle = "super.onCreate(savedInstanceState);"

          if marker not in source:
              if needle not in source:
                  raise RuntimeError("Could not find MainActivity.onCreate() insertion point")

              safe_code = '''super.onCreate(savedInstanceState);
                  // SPARKI_SAFE_SYSTEM_BARS
                  if (android.os.Build.VERSION.SDK_INT >= android.os.Build.VERSION_CODES.R) {
                      getWindow().setDecorFitsSystemWindows(true);
                  }'''

              source = source.replace(needle, safe_code, 1)
              main.write_text(source, encoding="utf-8")

          base_styles = project / "app/src/main/res/values/styles.xml"
          v35_styles = project / "app/src/main/res/values-v35/styles.xml"

          tree = ET.parse(base_styles)
          root = tree.getroot()
          styles = root.findall("style")

          if not styles:
              raise RuntimeError("No <style> found in styles.xml")

          theme = next(
              (style for style in styles if "theme" in style.attrib.get("name", "").lower()),
              styles[0]
          )

          item_name = "android:windowOptOutEdgeToEdgeEnforcement"
          if not any(item.attrib.get("name") == item_name for item in theme.findall("item")):
              item = ET.SubElement(theme, "item", {"name": item_name})
              item.text = "true"

          v35_styles.parent.mkdir(parents=True, exist_ok=True)
          tree.write(v35_styles, encoding="utf-8", xml_declaration=True)

          print("Applied Sparki Android safe-area fix.")
          PY

      - name: Build debug APK
        working-directory: sparki-door2door-android
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Sparki-Door2Door-APK
          path: sparki-door2door-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
